<svg width="560" height="300" viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0e0f"/>
      <stop offset="100%" stop-color="#161a1c"/>
    </linearGradient>
    <style>
      .title { font: bold 20px 'Courier New', monospace; fill: #e8e0cc; letter-spacing: 1px; }
      .subtitle { font: 11px 'Courier New', monospace; fill: #ff7b1c; letter-spacing: 2px; }
      .stat-label { font: 12px 'Courier New', monospace; fill: #8a9199; }
      .stat-value { font: bold 12px 'Courier New', monospace; fill: #e8e0cc; }
      .lang-label { font: 11px 'Courier New', monospace; fill: #8a9199; }
      .streak-number { font: bold 34px 'Courier New', monospace; fill: #c0392b; }
      .streak-label { font: 10px 'Courier New', monospace; fill: #8a9199; letter-spacing: 1px; }
      .rune { fill: none; stroke: #ff7b1c; stroke-width: 1.5; opacity: 0.6; }
    </style>
  </defs>

  <rect width="560" height="300" rx="10" fill="url(#bg-grad)" stroke="#4a4f52" stroke-width="2"/>

  <!-- torch corner flames -->
  <circle cx="26" cy="26" r="4" fill="#ff7b1c"><animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="534" cy="26" r="4" fill="#ff7b1c"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>

